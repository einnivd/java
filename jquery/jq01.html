<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- jquery cdn은 js보다 위에 있어야 한다. -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <!-- 선택자 -->
    <h1 id="title">안녕하세요</h1>
    <p class="text">글자1</p>
    <div class="box">
      <p>박스</p>
    </div>
    <script>
      // $ 제이쿼리 시작
      // $() html에서 요소 찾기
      // .css() 스타일 변경
      $("#title").css("color", "red");
      $(".text").css("font-size", "30px");

      // 스타일을 한 번에 여러개 적용할 때
      $(".text").css({
        "font-size": "30px",
        color: "blue",
        // "background-color" : "pink",
        backgroundColor: "#999",
        padding: "20px",
      });

      //  요소 여러개 선택
      $("h1 , .text").css({
        backgroundColor: "green",
      });

      // 자식 선택
      $(".box p").css({
        width: "500px",
        height: "500px",
        backgroundColor: "skyblue",
      });
    </script>
  </body>
</html>
