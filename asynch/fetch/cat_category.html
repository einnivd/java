<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>고양이 페이지</title>
    <style>
      .wrap {
        width: 50%;
        margin: 0 auto;
        text-align: center;
      }

      .cat-card {
        width: 300px;
        border: 1px solid #ccc;
        padding: 10px;
        margin-bottom: 10px;
        text-align: center;
        margin: 0 auto;
      }

      .cat-image {
        width: 200px;
        height: 200px;
        object-fit: cover;
        margin: 0 auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>고양이 정보</h1>
      <div id="catList">
        <!-- js출력 -->
      </div>
    </div>

    <script>
      // url에서 쿼리문자열을 읽어와서 고양이 아이디를 가져온다.
      const urlParams = new URLSearchParams(window.location.search);
      console.log(urlParams);
      const catID = urlParams.get("id");
      function displayCatInfo() {
        fetch("cat.json")
          .then((res) => res.json())
          .then((data) => {
            console.log(data);
            const catListDiv = document.querySelector("#catList");
            const cat = data.find((c) => c.id === parseInt(catID));
            console.log(cat); // 쿼리params의 id와 같은 고양이 정보
            if (cat) {
              const catCard = document.createElement("div");
              catCard.className = "cat-card";
              catCard.innerHTML = `
                <img src="${cat.url}" alt="${cat.title}" class="cat-image">
                <h2>아이디 : ${cat.id}</h2>
                <h2>${cat.title}</h2>
                <p>고양이 특징 : ${cat.description}</p>
                `;
              catListDiv.appendChild(catCard);
            } else {
              catListDiv.textContent = "고양이 정보가 없습니다.";
            }
          })
          .catch((error)=>{
            console.log(error);
          }
          );
      }
      displayCatInfo();
    </script>
  </body>
</html>
