<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>고양이 정보</title>
    <style>
      .container {
        width: 800px;
        margin: 50px auto;
      }

      img {
        width: 100%;
        max-width: 500px;
      }

      .info {
        margin-top: 20px;
      }

      .info p {
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <div id="detail">
      <!-- js출력 -->
       <img src="image/cat1.jpg" alt="">
    </div>

    <script>
      // URL 파라미터 받기
      const params = new URLSearchParams(location.search);
      console.log(params);
      // id 추출
      const id = Number(params.get("id"));
      console.log(id);
      async function getDetail() {
        try {
          const res = await fetch("cat.json");
          const cats = await res.json();
          // 파라미터로 받아온 id와, json에 있는 id가 같은 요소를 찾는다.
          const cat = cats.find((item) => item.id === id);
          //   console.log(cat);
          const detail = document.querySelector("#detail");
          // 존재하지 않는 id처리 혹은 받아온 id가 없을 경우
          if (!cat) {
            detail.innerHTML = `
            <h2>고양이 정보를 찾을 수 없습니다.</h2>
            <a href="cat.html">고양이 목록으로 돌아가기</a>
            `;
          }
          detail.innerHTML = `
          <div class="container">
        <img src="${cat.image}" alt="${cat.image}">
        <div class="info">
            <h1>${cat.name}</h1>
            <p><strong>원산지: ${cat.origin}</strong></p>
            <p><strong>성격: ${cat.temperament}</strong></p>
            <p><strong>수명: ${cat.life_span}살</strong></p>
            <p><strong>지능: ⭐ ${cat.intelligence}</strong></p>
            <p><strong>친화력: 💘 ${cat.affection_level}</strong></p>
            <p><strong>설명</strong></p>
            <p>${cat.description}</p>
        </div>
        <p>
            <a href="cat.html">→ 목록으로 돌아가기</a>
        </p>
       </div>
          `
        } catch (e) {
          // console.log(e);
          console.error(e);
        }
      }
      getDetail();
    </script>
  </body>
</html>
